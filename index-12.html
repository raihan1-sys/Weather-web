<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aether — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#1e6bff}
@property --c2{syntax:'<color>';inherits:true;initial-value:#4aa8ff}
@property --c3{syntax:'<color>';inherits:true;initial-value:#ffb86b}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
html,body{margin:0;min-height:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font-family:'Sora',system-ui,sans-serif;--fg:#fff;--fg2:rgba(255,255,255,.74);color:var(--fg);background:#0b1030;overflow-x:hidden;transition:color .8s}
body[data-mood=snow]:not(.night),body[data-mood=fog]:not(.night){--fg:#0f2233;--fg2:rgba(15,34,51,.72)}
/* LAYERS: bg 0 → blobs 1 → sun/moon 2 → canvas 3 → app 10 */
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,var(--c1),var(--c2) 55%,var(--c3));transition:--c1 1.6s ease,--c2 1.6s ease,--c3 1.6s ease}
.bg::after{content:'';position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.6s}
body.night:not([data-mood=clear-night]) .bg::after{opacity:.45}
body[data-mood=clear-day] .bg{--c1:#1e6bff;--c2:#4aa8ff;--c3:#ffb86b}
body[data-mood=clear-night] .bg{--c1:#05061a;--c2:#151a4a;--c3:#3a1f6e}
body[data-mood=cloudy] .bg{--c1:#4a5d78;--c2:#6f86a3;--c3:#9fb0c4}
body[data-mood=rain] .bg{--c1:#1c2a3f;--c2:#2f4a6b;--c3:#4a6a8c}
body[data-mood=storm] .bg{--c1:#0e0f1f;--c2:#261f45;--c3:#3d2f63}
body[data-mood=snow] .bg{--c1:#9db9d6;--c2:#c3d6ea;--c3:#e3edf7}
body[data-mood=fog] .bg{--c1:#b9c2cc;--c2:#d2d8de;--c3:#aab4bf}
.blob{position:fixed;z-index:1;border-radius:50%;filter:blur(70px);opacity:.5;mix-blend-mode:screen;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
.b1{width:340px;height:340px;left:-80px;top:8%;background:#ff7ad9}
.b2{width:420px;height:420px;right:-120px;top:38%;background:#37e0ff;animation-duration:26s}
.b3{width:380px;height:380px;left:10%;bottom:-120px;background:#ffb347;animation-duration:31s}
@keyframes drift{to{transform:translate(38vw,-12vh) scale(1.35)}}
.sun,.moon{position:fixed;z-index:2;border-radius:50%;opacity:0;transition:opacity 1.6s;pointer-events:none}
.sun{top:-20px;right:-20px;width:230px;height:230px;background:radial-gradient(circle,#fffbe0 0 30%,#ffd45c 58%,#ff9d2e 100%);box-shadow:0 0 60px 30px rgba(255,200,80,.7),0 0 170px 90px rgba(255,160,50,.4);animation:pulseS 5s ease-in-out infinite}
.sun::before{content:'';position:absolute;inset:-120px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,160,.6) 0 5deg,transparent 5deg 18deg);-webkit-mask:radial-gradient(circle closest-side,transparent 30%,#000 50%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 30%,#000 50%,transparent 100%);animation:spin 45s linear infinite}
.moon{top:80px;right:34px;width:120px;height:120px;background:radial-gradient(circle at 62% 28%,rgba(140,150,200,.4) 0 8%,transparent 9%),radial-gradient(circle at 34% 66%,rgba(140,150,200,.35) 0 11%,transparent 12%),radial-gradient(circle at 70% 70%,rgba(140,150,200,.3) 0 6%,transparent 7%),radial-gradient(circle at 35% 35%,#fff,#eef1ff 40%,#bcc5ea);box-shadow:0 0 50px 18px rgba(200,215,255,.55),0 0 150px 60px rgba(150,170,255,.3);animation:pulseS 6s ease-in-out infinite}
@keyframes pulseS{50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#app{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wide{grid-column:1/-1}
header{grid-column:1/-1;display:flex;flex-direction:column;gap:12px}
.glass,.card{border:1px solid rgba(255,255,255,.42);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 22px 50px -14px rgba(0,0,25,.5),0 4px 14px rgba(0,0,25,.15)}
.bar{display:flex;border-radius:999px;padding:6px 6px 6px 20px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.07))}
.bar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:400 16px Sora,sans-serif}
.bar input::placeholder{color:var(--fg2)}
.bar button{border:0;border-radius:999px;padding:12px 22px;font:600 14px Sora,sans-serif;color:#10202e;background:#fff;cursor:pointer;transition:transform .25s,box-shadow .25s}
.bar button:hover{transform:scale(1.07);box-shadow:0 0 26px rgba(255,255,255,.8)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.chip,.seg button{flex:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:var(--fg);font:400 13px Sora,sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;transition:transform .25s,background .25s,box-shadow .25s}
.chip:hover,.seg button:hover{transform:translateY(-3px) scale(1.06);background:rgba(255,255,255,.3);box-shadow:0 8px 22px rgba(255,255,255,.25)}
.chip:active{transform:scale(.95)}
.chip.on,.seg .on{background:#fff;color:#10202e;font-weight:600}
.seg{display:flex;gap:4px;flex:none}
#err{margin:0;min-height:0;font-size:14px;color:var(--fg);padding:0 6px}
#err:not(:empty){padding:12px 16px;border-radius:16px;background:rgba(255,80,80,.28);border:1px solid rgba(255,255,255,.4);animation:rise .5s both}
.card{position:relative;overflow:hidden;border-radius:30px;padding:20px;color:var(--fg);
background:radial-gradient(420px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,var(--lg,.3)),transparent 55%),linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.07));
transition:scale .35s cubic-bezier(.2,.9,.2,1),box-shadow .35s,transform .25s ease-out}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%);animation:shimmer 7s calc(var(--i)*1.3s) ease-in-out infinite}
@keyframes shimmer{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.card:hover{scale:1.035;--lg:.5;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 30px 60px -12px rgba(0,0,25,.55),0 0 50px rgba(255,255,255,.3)}
.card:active{scale:.98}
#app.idle .card{opacity:0}
#app.go .card{animation:rise .95s cubic-bezier(.2,.9,.2,1) calc(var(--i)*80ms) backwards,float calc(4.6s + var(--i)*.7s) calc(1.2s + var(--i)*80ms) ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(90px) scale(.92);filter:blur(18px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes float{from{translate:0 0}to{translate:0 -8px}}
h1{margin:0;font-weight:600;font-size:24px}
h2{margin:0 0 14px;font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}
p{margin:0}.sub{color:var(--fg2);font-size:14px;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ic{position:relative;width:96px;height:96px;display:grid;place-items:center;font-size:62px;flex:none}
.halo{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 66%);animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.8);opacity:.45}50%{transform:scale(1.25);opacity:1}}
#icon{position:relative;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.temp{display:flex;align-items:flex-start;margin:6px 0 2px}
#t{font-size:128px;font-weight:200;line-height:1;letter-spacing:-6px}
#u{font-size:34px;font-weight:300;margin-top:14px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--fg2);gap:8px;flex-wrap:wrap}.meta b{color:var(--fg);font-weight:600}
.hrs{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 12px}
.pill{flex:none;width:66px;padding:12px 0;border-radius:22px;text-align:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:13px;display:flex;flex-direction:column;gap:8px}
.pill em{font-style:normal;font-size:24px}.pill b{font-weight:600;font-size:16px}.pill span{color:var(--fg2)}
.pill.now{background:rgba(255,255,255,.34);animation:pulse 2s ease-in-out infinite!important}
#app.go .pill{animation:pillIn .7s calc(.8s + var(--k)*100ms) cubic-bezier(.2,.9,.2,1) backwards}
@keyframes pillIn{from{opacity:0;transform:translateX(-26px) scale(.8)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.big{font-size:30px;font-weight:300}
.ringw{position:relative;width:108px;height:108px;margin:0 auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:9;stroke-linecap:round}
.trk{stroke:rgba(255,255,255,.22)}
#ring{stroke:#fff;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.9s cubic-bezier(.2,.9,.2,1);filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:300}
.cmp{position:relative;width:108px;height:108px;margin:0 auto 10px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.cmp i{position:absolute;font:normal 600 10px Sora;color:var(--fg2)}
.cmp .n{top:4px;left:50%;margin-left:-4px}.cmp .e{right:6px;top:50%;margin-top:-6px}.cmp .s{bottom:4px;left:50%;margin-left:-3px}.cmp .w{left:6px;top:50%;margin-top:-6px}
.nd{position:absolute;left:50%;bottom:50%;width:10px;height:38px;margin-left:-5px;transform-origin:50% 100%;background:linear-gradient(#ff4d3a,#ffb0a0);clip-path:polygon(50% 0,100% 100%,0 100%);transition:transform 1.9s cubic-bezier(.34,1.9,.64,1)}
.cmp::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff}
.c{text-align:center}
.uvbar{position:relative;height:8px;margin:20px 0 10px;border-radius:9px;background:linear-gradient(90deg,#4ade80,#facc15,#fb923c,#ef4444,#a855f7)}
#uvm,#dot{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.25);box-shadow:0 0 16px #fff;left:0;transition:left 1.8s cubic-bezier(.2,.9,.2,1)}
.track{position:relative;height:8px;margin:20px 0 14px;border-radius:9px;background:rgba(255,255,255,.25)}
#dot{background:#ffd45c;box-shadow:0 0 22px 6px rgba(255,200,60,.9);border-color:#fff}
.sunt{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}.sunt b{display:block;color:var(--fg);font-size:16px;font-weight:600}
.day{display:grid;grid-template-columns:54px 32px 36px 1fr 36px;align-items:center;gap:8px;padding:9px 0;font-size:14px}
.day .lo{color:var(--fg2);text-align:right}.day .hi{font-weight:600}.day em{font-style:normal;font-size:20px}
.rb{position:relative;height:7px;border-radius:9px;background:rgba(255,255,255,.22)}
.rb i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#7fd8ff,#ffd27a,#ff8a5c);box-shadow:0 0 12px rgba(255,200,120,.7);transform-origin:left}
#app.go .rb i{animation:grow 1.1s calc(1s + var(--k)*130ms) cubic-bezier(.2,.9,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-mood="clear-day">
<div class="bg"></div>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
<div class="sun" id="sun"></div><div class="moon" id="moon"></div>
<canvas id="cv"></canvas>

<main id="app" class="idle">
<header>
  <form id="f" class="glass bar"><input id="q" placeholder="Search any city…" autocomplete="off" aria-label="City"><button id="go">Search</button></form>
  <div class="row">
    <div class="chips" id="chips"></div>
    <div class="seg" id="seg"><button data-u="c" class="on">°C</button><button data-u="f">°F</button></div>
  </div>
  <p id="err" role="alert"></p>
</header>

<section class="card wide" id="main" style="--i:0">
  <div class="top"><div><h1 id="city">—</h1><p class="sub" id="cond"></p><p class="sub" id="time"></p></div>
  <div class="ic"><i class="halo"></i><span id="icon">☀️</span></div></div>
  <div class="temp"><span id="t">0</span><span id="u">°C</span></div>
  <div class="meta"><span>Feels like <b id="fl"></b></span><span>High <b id="hi"></b> · Low <b id="lo"></b></span></div>
</section>

<section class="card wide" style="--i:1"><h2>Next 12 hours</h2><div class="hrs" id="hrs"></div></section>

<section class="card c" style="--i:2"><h2>Humidity</h2><div class="ringw"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="42"/><circle id="ring" cx="50" cy="50" r="42"/></svg><b id="hum"></b></div></section>

<section class="card c" style="--i:3"><h2>Wind</h2><div class="cmp"><i class="n">N</i><i class="e">E</i><i class="s">S</i><i class="w">W</i><div class="nd" id="nd"></div></div><p class="big" id="ws"></p><p class="sub" id="wd"></p></section>

<section class="card" style="--i:4"><h2>UV index</h2><p class="big" id="uv"></p><div class="uvbar"><div id="uvm"></div></div><p class="sub" id="uvl"></p></section>

<section class="card" style="--i:5"><h2>Sun</h2><div class="track"><div id="dot"></div></div><div class="sunt"><span>Rise<b id="sr"></b></span><span style="text-align:right">Set<b id="ss"></b></span></div></section>

<section class="card wide" style="--i:6"><h2>5-day forecast</h2><div id="days"></div></section>
</main>

<script>
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let U='c',DATA=null,ctok=0;
const tc=c=>Math.round(U=='c'?c:c*9/5+32);
const CITIES=['Dubai','Singapore','Reykjavik','Tokyo','London'];

/* weather code → label, icon, mood, scene targets */
function wx(c,d){
  let L,I,m,s={cloud:.25,rain:0,snow:0,storm:0,fog:0};
  if(c<=1){L=c?'Mainly clear':'Clear sky';I=d?'☀️':'🌙';m=d?'clear-day':'clear-night'}
  else if(c==2){L='Partly cloudy';I=d?'⛅':'☁️';m=d?'clear-day':'clear-night';s.cloud=.6}
  else if(c==3){L='Overcast';I='☁️';m='cloudy';s.cloud=1}
  else if(c<50){L='Fog';I='🌫️';m='fog';s.cloud=1;s.fog=1}
  else if(c<70||(c>=80&&c<83)){L=c<58?'Drizzle':'Rain';I='🌧️';m='rain';s.cloud=1;s.rain=c<58?.4:1}
  else if(c<80||c==85||c==86){L='Snow';I='❄️';m='snow';s.cloud=.8;s.snow=1}
  else{L='Thunderstorm';I='⛈️';m='storm';s.cloud=1;s.rain=1;s.storm=1}
  return[L,I,m,s]
}

/* ---------- background canvas scene ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W,H,Dp,t=0,clouds,stars,drops,flakes,ripples=[],bolt=null,nextBolt=200,shoot=null,nextShoot=150;
const K=['cloud','rain','snow','storm','fog','dark','stars'];
const T={},C={};K.forEach(k=>T[k]=C[k]=0);
const R=Math.random,mv=RM?0:1;
function init(){
  Dp=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*Dp;cv.height=H*Dp;ctx.setTransform(Dp,0,0,Dp,0,0);
  clouds=[...Array(10)].map(()=>({x:R()*(W+500)-250,y:R()*H*.5,s:.8+R()*1.1,v:.15+R()*.35,p:[...Array(5)].map((_,i)=>[(i-2)*55+R()*20,R()*30-15-(i==2?22:0),50+R()*40])}));
  stars=[...Array(130)].map(()=>({x:R()*W,y:R()*H*.75,r:.4+R()*1.4,ph:R()*6.28,sp:.02+R()*.05}));
  drops=[...Array(240)].map(()=>newDrop(true));
  flakes=[...Array(170)].map(()=>({x:R()*W,y:R()*H,r:1.5+R()*3,v:.6+R()*1.2,ph:R()*6.28}));
}
function newDrop(f){return{x:R()*(W+100),y:f?R()*H:-30,l:12+R()*14,v:11+R()*8,ty:H*(.55+R()*.42)}}
function makeBolt(){
  let x=W*(.15+R()*.7),y=0,pts=[[x,0]],br=[];
  while(y<H*.62){y+=18+R()*30;x+=(R()-.5)*70;pts.push([x,y]);
    if(R()<.2){let bx=x,by=y,b=[[bx,by]];for(let i=0;i<4;i++){bx+=(R()-.3)*55;by+=14+R()*20;b.push([bx,by])}br.push(b)}}
  bolt={pts,br,life:26}
}
function path(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
function loop(){
  t++;ctx.clearRect(0,0,W,H);
  K.forEach(k=>C[k]+=(T[k]-C[k])*.04);
  // stars + shooting stars
  if(C.stars>.02){
    stars.forEach(s=>{ctx.globalAlpha=C.stars*(.45+.55*Math.sin(t*s.sp+s.ph));ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()});
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    if(!shoot&&t>nextShoot&&!RM){shoot={x:R()*W*.8,y:R()*H*.3,l:0};nextShoot=t+180+R()*320}
    if(shoot){shoot.l+=1;const a=shoot.l*14,x=shoot.x+a,y=shoot.y+a*.5,g=ctx.createLinearGradient(x,y,x-130,y-65);
      g.addColorStop(0,`rgba(255,255,255,${C.stars})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-130,y-65);ctx.stroke();if(shoot.l>40)shoot=null}
  }
  // clouds (soft radial puffs)
  const g0=Math.round(255-C.dark*165),ca=.14+.52*C.cloud+.15*C.fog;
  clouds.forEach(c=>{c.x+=c.v*mv*(1+C.storm);if(c.x>W+280)c.x=-300;
    c.p.forEach(p=>{const x=c.x+p[0]*c.s,y=c.y+p[1]*c.s,r=p[2]*c.s,g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(${g0},${g0},${g0+8},${ca})`);g.addColorStop(1,`rgba(${g0},${g0},${g0+8},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)})});
  // rain + ripples
  if(C.rain>.02){
    ctx.strokeStyle='rgba(200,225,255,.65)';ctx.lineWidth=1.4;
    const n=Math.floor(C.rain*drops.length);
    for(let i=0;i<n;i++){const d=drops[i];d.y+=d.v*mv;d.x-=d.v*.12*mv;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.l*.12,d.y-d.l);ctx.stroke();
      if(d.y>=d.ty){ripples.push({x:d.x,y:d.ty,r:1});drops[i]=newDrop()}}
  }
  ripples=ripples.filter(r=>r.r<30);
  ripples.forEach(r=>{r.r+=.9;ctx.strokeStyle=`rgba(220,238,255,${.7*(1-r.r/30)})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.32,0,0,6.28);ctx.stroke()});
  // snow
  if(C.snow>.02){
    const n=Math.floor(C.snow*flakes.length);
    for(let i=0;i<n;i++){const f=flakes[i];f.y+=f.v*mv;f.x+=Math.sin(t*.02+f.ph)*.7*mv;if(f.y>H+10){f.y=-10;f.x=R()*W}
      ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='rgba(110,140,185,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fill();ctx.stroke()}
  }
  // lightning + screen flash
  if(C.storm>.5&&!bolt&&t>nextBolt&&!RM){makeBolt();nextBolt=t+110+R()*260}
  if(bolt){const a=bolt.life/26*(bolt.life%10<6?1:.35);
    ctx.fillStyle=`rgba(215,228,255,${a*.5})`;ctx.fillRect(0,0,W,H);
    ctx.shadowColor='#9bb8ff';ctx.shadowBlur=28;ctx.strokeStyle=`rgba(255,255,255,${Math.min(1,a*1.6)})`;ctx.lineWidth=3.2;path(bolt.pts);
    ctx.lineWidth=1.5;bolt.br.forEach(path);ctx.shadowBlur=0;if(--bolt.life<=0)bolt=null}
  requestAnimationFrame(loop)
}
addEventListener('resize',init);init();loop();

/* ---------- UI helpers ---------- */
const app=$('#app');
function err(m){$('#err').textContent=m||''}
function count(to){
  const id=++ctok;if(RM){$('#t').textContent=to;return}
  const t0=performance.now();(function f(n){if(id!=ctok)return;const p=Math.min((n-t0)/1600,1);
    $('#t').textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)
}
function slide(el,prop,from,to,delay){
  el.style.transition='none';el.style[prop]=from;void el.offsetWidth;el.style.transition='';
  setTimeout(()=>el.style[prop]=to,delay)
}

function render(){
  const{p,w}=DATA,c=w.current,d=w.daily,h=w.hourly,day=c.is_day==1;
  const[L,I,mood,s]=wx(c.weather_code,day);
  document.body.dataset.mood=mood;document.body.classList.toggle('night',!day);
  Object.assign(T,s,{dark:Math.min(1,(day?0:.6)+({storm:.8,rain:.5,cloudy:.25}[mood]||0)),stars:day?0:Math.max(0,1.2-s.cloud*1.2)});
  const clear=c.weather_code<=2,v=[1,.9,.6][c.weather_code]||0;
  $('#sun').style.opacity=day&&clear?v:0;$('#moon').style.opacity=!day&&clear?v:0;

  $('#city').textContent=p.name+(p.country_code?', '+p.country_code:'');
  $('#cond').textContent=L;$('#icon').textContent=I;
  $('#time').textContent='Local time '+c.time.slice(11,16);
  $('#u').textContent='°'+U.toUpperCase();
  $('#fl').textContent=tc(c.apparent_temperature)+'°';
  $('#hi').textContent=tc(d.temperature_2m_max[0])+'°';$('#lo').textContent=tc(d.temperature_2m_min[0])+'°';
  count(tc(c.temperature_2m));

  // 12-hour strip
  let i0=h.time.findIndex(x=>x>=c.time.slice(0,13)+':00');if(i0<0)i0=0;
  $('#hrs').innerHTML=[...Array(12)].map((_,k)=>{const i=i0+k,hh=+h.time[i].slice(11,13);
    return`<div class="pill${k?'':' now'}" style="--k:${k}"><span>${k?hh+':00':'Now'}</span><em>${wx(h.weather_code[i],hh>=6&&hh<20)[1]}</em><b>${tc(h.temperature_2m[i])}°</b></div>`}).join('');

  // 5-day
  const mn=Math.min(...d.temperature_2m_min.slice(0,5)),mx=Math.max(...d.temperature_2m_max.slice(0,5)),rg=mx-mn||1;
  $('#days').innerHTML=[0,1,2,3,4].map(i=>{
    const nm=i?new Date(d.time[i]+'T12:00').toLocaleDateString('en',{weekday:'short'}):'Today',lo=d.temperature_2m_min[i],hi=d.temperature_2m_max[i];
    return`<div class="day"><span>${nm}</span><em>${wx(d.weather_code[i],1)[1]}</em><span class="lo">${tc(lo)}°</span><div class="rb"><i style="--k:${i};left:${(lo-mn)/rg*100}%;width:${Math.max((hi-lo)/rg*100,6)}%"></i></div><span class="hi">${tc(hi)}°</span></div>`}).join('');

  // humidity ring
  const hm=c.relative_humidity_2m;$('#hum').textContent=hm+'%';
  slide($('#ring'),'strokeDashoffset',264,264*(1-hm/100),900);
  // wind
  const ws=c.wind_speed_10m,deg=c.wind_direction_10m;
  $('#ws').textContent=U=='c'?Math.round(ws)+' km/h':Math.round(ws*.621)+' mph';
  $('#wd').textContent='from '+['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]+' · '+Math.round(deg)+'°';
  slide($('#nd'),'transform','rotate(0deg)',`rotate(${deg>180?deg-360:deg}deg)`,900);
  // UV
  const uv=d.uv_index_max[0];$('#uv').textContent=uv.toFixed(1);
  $('#uvl').textContent=uv<3?'Low':uv<6?'Moderate':uv<8?'High':uv<11?'Very high':'Extreme';
  slide($('#uvm'),'left','0%',Math.min(uv/11,1)*100+'%',1000);
  // sun
  const sr=Date.parse(d.sunrise[0]),ss=Date.parse(d.sunset[0]),nw=Date.parse(c.time);
  $('#sr').textContent=d.sunrise[0].slice(11,16);$('#ss').textContent=d.sunset[0].slice(11,16);
  slide($('#dot'),'left','0%',Math.max(0,Math.min(1,(nw-sr)/(ss-sr)))*100+'%',1100);

  app.classList.remove('idle','go');void app.offsetWidth;app.classList.add('go');
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()==p.name.toLowerCase()));
}

const API='https://api.open-meteo.com/v1/forecast?current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=6&wind_speed_unit=kmh';
async function load(name){
  name=(name||'').trim();if(!name)return;err('');$('#go').disabled=true;
  try{
    const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name='+encodeURIComponent(name))).json();
    if(!g.results||!g.results.length){err(`We couldn’t find “${name}”. Check the spelling or try another city.`);return}
    const p=g.results[0];
    const w=await(await fetch(`${API}&latitude=${p.latitude}&longitude=${p.longitude}`)).json();
    if(!w.current)throw 0;
    DATA={p,w};render();
  }catch(e){err('We couldn’t reach the weather service. Check your connection and try again.')}
  finally{$('#go').disabled=false}
}

$('#chips').innerHTML=CITIES.map(c=>`<button class="chip" type="button">${c}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.classList.contains('chip')){$('#q').value='';load(e.target.textContent)}};
$('#f').onsubmit=e=>{e.preventDefault();load($('#q').value)};
$('#seg').onclick=e=>{const u=e.target.dataset.u;if(!u||u==U)return;U=u;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.u==U));if(DATA)render()};

/* pointer light on cards + 3D tilt on main card */
app.addEventListener('pointermove',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
  if(c.id=='main'&&!RM)c.style.transform=`perspective(900px) rotateX(${(.5-y/r.height)*14}deg) rotateY(${(x/r.width-.5)*14}deg)`;
});
$('#main').addEventListener('pointerleave',e=>e.currentTarget.style.transform='');

load('London');
</script>
